<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- SEO -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nawraj Budhathoki is a CS major student interested in programming, technology, and software development.">
    <meta name="keywords" content="Nawraj Budhathoki, Nawraj, computer science, IT student, portfolio, Nepal">
    <meta name="author" content="Nawraj Budhathoki">

    <meta property="og:title" content="Nawraj Budhathoki">
    <meta property="og:description" content="The portfolio of Nawraj Budhathoki, a CS major student interested in technology and software development.">
    <meta property="og:type" content="website">

    <title>Nawraj Budhathoki</title>

    <style>
        /* ------------------------------
           General Styles
        ------------------------------ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
        }

        /* ------------------------------
           Navigation
        ------------------------------ */

        header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav {
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #2563eb;
        }

        .nav-links {
            display: flex;
            list-style: none;
        }

        .nav-links a {
            color: #374151;
            font-size: 15px;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #2563eb;
        }

        /* ------------------------------
           Hero / Intro Section
        ------------------------------ */

        .hero {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            text-align: center;
        }

        .hero-content {
            width: 100%;
            max-width: 800px;
            margin: auto;
        }

        .welcome {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            padding: 7px 15px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: clamp(40px, 7vw, 72px);
            line-height: 1.1;
            margin-bottom: 20px;
            color: #111827;
        }

        .hero h1 span {
            color: #2563eb;
        }

        .hero p {
            max-width: 650px;
            margin: 0 auto 30px;
            color: #6b7280;
            font-size: 18px;
        }

        .button {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 7px;
            font-weight: bold;
            border: 1px solid #2563eb;
            background: #2563eb;
            color: white;
            transition: 0.2s ease;
        }

        .button:hover {
            background: #1d4ed8;
        }

        /* ------------------------------
           Footer
        ------------------------------ */

        footer {
            background: #0b1120;
            color: #9ca3af;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        /* ------------------------------
           Mobile
        ------------------------------ */

        @media (max-width: 700px) {

            .hero {
                min-height: 80vh;
            }

            .hero p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <header>
        <div class="container">
            <nav aria-label="Main navigation">

                <a href="#home" class="logo">
                    Nawraj Budhathoki
                </a>

                <ul class="nav-links">
                    <li>
                        <a href="#home">Home</a>
                    </li>
                </ul>

            </nav>
        </div>
    </header>

    <main>

        <!-- Intro Section -->
        <section id="home" class="hero">
            <div class="container">

                <div class="hero-content">

                    <span class="welcome">
                        Welcome to my portfolio
                    </span>

                    <h1>
                        Hi, I'm <span>Nawraj Budhathoki</span>
                    </h1>

                    <p>
                        A CSIT student interested in programming,
                        technology, and building useful software.
                    </p>

                </div>

            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>
            &copy; <span id="year"></span>
            Nawraj Budhathoki. All rights reserved.
        </p>
    </footer>

    <script>
        // Automatically update the copyright year
        document.getElementById("year").textContent =
            new Date().getFullYear();
    </script>

</body>
</html>
